name: Actions storage cleanup

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: windows-os-actions-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-actions]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Remove old Actions artifacts and disposable caches
        shell: bash
        run: |
          set -euo pipefail
          # Snapshot the existing storage and active runs first. This removes
          # stored artifacts/caches, NOT workflow runs, logs, code or releases.
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            | jq -s '[.[].artifacts[] | select(.expired == false)]' > artifacts.json
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            | jq -s '[.[].actions_caches[]]' > caches.json
          # Preserve artifacts belonging to any currently non-completed run.
          # Check all active statuses, including approval/waiting runs.
          for status in queued in_progress waiting requested pending; do
            gh api --paginate "repos/$REPO/actions/runs?status=$status&per_page=100" \
              --jq '.workflow_runs[].id'
          done | sort -u > active-runs.txt
          jq -Rs 'split("\n") | map(select(length > 0) | tonumber)' active-runs.txt > active-runs.json
          jq --slurpfile active active-runs.json \
            '[.[] | select(.workflow_run.id as $id | ($active[0] | index($id)) == null)]' \
            artifacts.json > old-artifacts.json
          artifacts_deleted=0
          artifact_bytes=0
          caches_deleted=0
          cache_bytes=0
          failures=0
          while IFS=$'\t' read -r id bytes; do
            if gh api --method DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null; then
              artifacts_deleted=$((artifacts_deleted+1))
              artifact_bytes=$((artifact_bytes+bytes))
            else
              failures=$((failures+1))
              echo "::warning::Could not delete artifact $id"
            fi
          done < <(jq -r '.[] | [.id,.size_in_bytes] | @tsv' old-artifacts.json)
          # Caches are reproducible build data, not source files. Remove the
          # snapshot of old entries; active runners can recreate their caches.
          while IFS=$'\t' read -r id bytes; do
            if gh api --method DELETE "repos/$REPO/actions/caches/$id" >/dev/null; then
              caches_deleted=$((caches_deleted+1))
              cache_bytes=$((cache_bytes+bytes))
            else
              failures=$((failures+1))
              echo "::warning::Could not delete cache $id"
            fi
          done < <(jq -r '.[] | [.id,.size_in_bytes] | @tsv' caches.json)
          {
            echo "### Actions storage cleanup"
            echo "- Artifacts deleted: $artifacts_deleted ($artifact_bytes bytes)"
            echo "- Caches deleted: $caches_deleted ($cache_bytes bytes)"
            echo "- Failed deletions: $failures"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Report the actual remaining non-expired artifact and cache sizes.
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            | jq -s '[.[].artifacts[] | select(.expired == false)] | {remaining_artifacts:length,remaining_artifact_bytes:(map(.size_in_bytes)|add//0)}'
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            | jq -s '[.[].actions_caches[]] | {remaining_caches:length,remaining_cache_bytes:(map(.size_in_bytes)|add//0)}'
          test "$failures" -eq 0
