name: React migration checks

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

concurrency:
  group: windows-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-and-contracts:
    # Push checks are opt-in; the triggering commit must contain [run-ci].
    # Explicit manual workflow dispatch also runs checks when requested.
    if: contains(github.event.head_commit.message, '[run-ci]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Check original source migration inventory
        run: npm run audit:legacy
      - name: Verify original Contacts source style and shortcut fidelity
        run: npm run test:source
      - name: Build Vite application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test boot, Guest desktop, windows and Contacts interactions
        run: npm run test:e2e
      - name: Preserve test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
